<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report | Agapay</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+Pro:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="styles.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>

    <style>
        .report-main {
            min-height: 100vh;
            padding-top: 14vh;
            padding-bottom: 4rem;
        }

        .report-shell {
            max-width: 900px;
            margin: 0 auto;
            background: var(--bg-surface);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        .report-header {
            padding: 1.25rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .report-kicker {
            text-transform: uppercase;
            letter-spacing: 0.08em;
            font-size: 0.72rem;
            color: var(--text-muted);
            margin-bottom: 0.35rem;
            font-weight: 600;
        }

        .report-title {
            margin: 0;
            font-size: var(--step-2);
            line-height: 1.2;
            font-family: 'Lora', serif;
        }

        .report-actions {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .report-link {
            color: var(--text-secondary);
            border: 1px solid var(--border-color);
            padding: 0.45rem 0.75rem;
            border-radius: 4px;
            font-size: 0.88rem;
            transition: border-color 0.2s ease, color 0.2s ease;
        }

        .report-link:hover {
            border-color: var(--accent-hope);
            color: var(--text-primary);
        }

        .report-content {
            padding: 2rem 1.5rem 2.25rem;
        }

        .markdown-body {
            color: var(--text-primary);
            line-height: 1.75;
            font-size: 1.04rem;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            font-family: 'Lora', serif;
            line-height: 1.25;
            margin: 1.75rem 0 0.9rem;
            color: var(--text-primary);
        }

        .markdown-body h1 {
            font-size: var(--step-4);
            margin-top: 0;
        }

        .markdown-body h2 {
            font-size: var(--step-2);
            border-top: 1px solid var(--border-color);
            padding-top: 1.1rem;
        }

        .markdown-body h3 {
            font-size: var(--step-1);
        }

        .markdown-body p {
            margin: 0.9rem 0;
            color: var(--text-secondary);
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 0.9rem 0 1rem 1.2rem;
            color: var(--text-secondary);
        }

        .markdown-body li + li {
            margin-top: 0.45rem;
        }

        .markdown-body blockquote {
            margin: 1rem 0;
            padding: 0.75rem 1rem;
            border-left: 3px solid var(--accent-hope);
            background: rgba(0, 0, 0, 0.03);
            color: var(--text-secondary);
        }

        .error-state {
            border: 1px solid rgba(239, 68, 68, 0.35);
            background: rgba(239, 68, 68, 0.08);
            color: #7f1d1d;
            border-radius: 6px;
            padding: 1rem;
        }

        @media (max-width: 768px) {
            .report-main {
                padding-top: 12vh;
            }

            .report-content {
                padding: 1.25rem 1rem 1.5rem;
            }

            .report-header {
                padding: 1rem;
            }

            .report-title {
                font-size: var(--step-1);
            }
        }
    </style>
</head>
<body>
    <div class="noise-overlay"></div>

    <nav class="navigation">
        <div class="nav-content" style="display: flex; align-items: center; justify-content: space-between; width: 100%;">
            <a href="index.html" class="logo" style="text-decoration: none; color: inherit;">Agapay</a>
            <div class="nav-links" style="display: flex; gap: 2rem; align-items: center;">
                <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Home</a>
                <a href="articles.html" style="color: var(--text-primary); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">Articles</a>
                <a href="about.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.95rem; font-weight: 500; transition: color 0.3s;">About</a>
            </div>
        </div>
    </nav>

    <main class="report-main">
        <section class="section pt-0">
            <div class="container">
                <div class="report-shell">
                    <header class="report-header">
                        <div>
                            <p class="report-kicker">Standardized Report View</p>
                            <h1 id="reportTitle" class="report-title">Loading report...</h1>
                        </div>
                        <div class="report-actions">
                            <a id="openMarkdown" class="report-link" href="#">Open Markdown</a>
                            <a class="report-link" href="articles.html">Back to Articles</a>
                        </div>
                    </header>
                    <article class="report-content">
                        <div id="reportBody" class="markdown-body"></div>
                    </article>
                </div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container text-center">
            <p style="color: var(--text-muted); font-size: 0.9rem;">Agapay Research Initiative</p>
        </div>
    </footer>

    <script>
        const REPORT_MAP = {
            "trapped-in-the-shadows": {
                title: "Trapped in the Shadows",
                file: "trapped-in-the-shadows.md"
            },
            "no-safety-nets-no-future": {
                title: "No Safety Nets, No Future",
                file: "no-safety-nets-no-future.md"
            },
            "ibons-wake-up-call": {
                title: "IBON's Wake-Up Call",
                file: "ibons-wake-up-call.md"
            },
            "lgu-frontlines": {
                title: "LGU Frontlines",
                file: "lgu-frontlines.md"
            }
        };

        const params = new URLSearchParams(window.location.search);
        const reportKey = params.get("article");

        const reportTitleEl = document.getElementById("reportTitle");
        const reportBodyEl = document.getElementById("reportBody");
        const openMarkdownLink = document.getElementById("openMarkdown");

        function renderError(message) {
            reportTitleEl.textContent = "Report unavailable";
            reportBodyEl.innerHTML = `<div class="error-state">${message}</div>`;
            openMarkdownLink.style.display = "none";
        }

        async function loadReport() {
            const reportMeta = REPORT_MAP[reportKey];

            if (!reportMeta) {
                renderError("The selected report does not exist. Please return to the Articles page and select a valid entry.");
                return;
            }

            reportTitleEl.textContent = reportMeta.title;
            openMarkdownLink.href = reportMeta.file;

            try {
                const response = await fetch(reportMeta.file);
                if (!response.ok) {
                    throw new Error(`Unable to fetch report file (${response.status}).`);
                }

                const markdown = await response.text();
                reportBodyEl.innerHTML = marked.parse(markdown);
            } catch (error) {
                renderError("Unable to load this report in the standardized view. If you are opening files directly from your file system, use a local server (for example VS Code Live Server) and try again.");
            }
        }

        loadReport();
    </script>
</body>
</html>
